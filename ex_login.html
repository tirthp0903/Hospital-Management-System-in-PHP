<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="bootstrap-5.3.8-dist/css/bootstrap.min.css">
    <script src="bootstrap-5.3.8-dist/js/bootstrap.bundle.js"></script>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center mt-5">
            <div class="col-md-5">
                <div class="card h-100">
                    <h3 class="text-center bg-primary text-white">Admin Login</h3>
                    <div class="card-body">
                        <form action="" method="post">
                            <div class="mb-3">
                                <label for="">Username : </label>
                                <input type="text" name="username" class="form-control" required id="">
                            </div>
                            <div class="mb-3">
                                <label for="">Password : </label>
                                <input type="password" name="password" class="form-control" required id="">
                            </div>

                            <div class="d-grid">
                                <input type="submit" name="login" value="login" class="bg-success">
                            </div>
                        </form>
                    </div>
                </div>
            </div>

        </div>
    </div>
</body>
</html>
